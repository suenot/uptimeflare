name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      manual-trigger:
        description: 'This merges upstream into the fork and stops on a conflict. Resolve conflicts before rerunning; it never deletes MarketMaker customizations.'
        type: boolean
        required: true
        default: false
      override-token:
        description: '[Optional] Paste a PAT here. If left blank, PAT_TOKEN secret will be used (if set). Used to solve `refusing to allow a GitHub App to create or update workflow... `, more info at https://github.com/lyc8503/UptimeFlare/wiki/Synchronize-updates-from-upstream#upgrade-methods'
        required: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          token: ${{ inputs.override-token || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/lyc8503/UptimeFlare.git 2>/dev/null || true
          git fetch upstream main

          if ! git merge --no-commit --no-ff upstream/main; then
            git merge --abort
            echo "Upstream conflicts with MarketMaker customizations. Resolve locally and push a reviewed merge."
            exit 1
          fi

          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi

          git commit -am "chore: sync upstream UptimeFlare"
          git push

      - name: Trigger deployment
        if: ${{ inputs.override-token == '' }}
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy.yml
